# בנייה ופרסום אוטומטי ל-GitHub Pages.
# מפרסם לענף gh-pages — בדיוק כמו שהאתר מוגדר היום, בלי לשנות הגדרות בריפו.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npm run build

      # .nojekyll מונע מ-GitHub Pages להתעלם מקבצים שמתחילים בקו תחתון
      - run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
